# GeoFeat reliability-gated geometry path with GCDR.
# Geometry enters through branch encoding, reliability gating, GCDR, and AFT.

DATASET:
  USE_MEGADEPTH: true
  USE_COCO: true
  MEGADEPTH_BATCH_SIZE: 1
  COCO_BATCH_SIZE: 1

MODEL:
  BACKBONE: "Standard"

  DESCRIPTOR_DIM: 96
  DESCRIPTOR_ENCODER: [96]
  OUTPUT_DIM: 96

  GEOMETRIC_FEATURES:
    DEPTH: true
    GRADIENTS: true
    CURVATURES: true

  DEPTH_ENCODER: [32, 48]
  DEPTH_DIM: 96
  GRADIENT_ENCODER: [48, 64]
  GRADIENT_DIM: 96
  CURVATURE_ENCODER: [32, 48]
  CURVATURE_DIM: 96

  GEO_PREPROCESS_MODE: "no_unfold_lite"
  REFINER_TYPE: "GCDR"
  REPEATABILITY_ALPHA: 0.35

  ATTENTIONAL_LAYERS: 2
  AFT:
    NUM_GROUPS: 4
    LOCAL_KERNEL_SIZES: [3, 5]
    DOMAIN_ADAPT: true
    TEMPERATURE_MIN: 0.70
    TEMPERATURE_MAX: 1.60
    LOCAL_BASE_GAIN: 1.0
    CORR_BASE_GAIN: 0.5

  GEO_RELIABILITY_GATE:
    ENABLED: true
    HIDDEN_DIM: 12
    GATE_FLOOR: 0.20
    BIAS_INIT: 2.0
    FUSION_GAIN: 0.50

  GCDR:
    GEO_COMPRESS: 12
    RELIABILITY_HIDDEN: 12
    GATE_FLOOR: 0.10
    RESIDUAL_GAIN: 0.35
    RESIDUAL_GATE_FLOOR: 0.05
    RESIDUAL_CLIP: 0.20

LOSS:
  # DAM depth -> GeometricExtractor targets:
  # depth=0D, gradients=1D [dx,dy,nx,ny,nz], curvatures=2D mean_curv.
  # Conservative mainline keeps geometry supervision from dominating descriptor learning.
  DEPTH_WEIGHT: 1.0
  GRADIENT_WEIGHT: 2.0
  CURVATURE_WEIGHT: 1.0

  RELIABILITY_LOSS_WEIGHT: 0.25
  RELIABILITY_CONSISTENCY_WEIGHT: 0.25
  RELIABILITY_TARGET_SCALE: 6.0
  REPEATABILITY_LOSS_WEIGHT: 0.03
  DESCRIPTOR_PROTECT_WEIGHT: 0.10
  RELIABLE_ENHANCE_MARGIN: 0.02
  RELIABLE_ENHANCE_WEIGHT: 0.05
  RELIABLE_ENHANCE_THRESHOLD: 0.50
  RELIABLE_ENHANCE_QUANTILE: 0.50
  UNRELIABLE_SUPPRESS_WEIGHT: 0.10
  UNRELIABLE_SUPPRESS_THRESHOLD: 0.45
  UNRELIABLE_SUPPRESS_QUANTILE: 0.25

TRAIN:
  USE_DUAL_KPT_LOSS: true
