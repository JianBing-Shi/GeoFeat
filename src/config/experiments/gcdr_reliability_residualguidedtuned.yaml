# GCDR Reliability ResidualGuidedTuned
#
# Conservative main-line refinement over ResidualGuided:
# 1) reduce residual injection strength to avoid over-correcting descriptors
# 2) sharpen reliability supervision to emphasize stricter top-ranked matches

MODEL:
  REFINER_TYPE: "GCDR"
  GEO_PREPROCESS_MODE: "no_unfold_lite"

  GCDR:
    GEO_COMPRESS: 16
    RELIABILITY_HIDDEN: 16
    GATE_FLOOR: 0.10
    RESIDUAL_GAIN: 0.50
    RESIDUAL_GATE_FLOOR: 0.05

LOSS:
  RELIABILITY_LOSS_WEIGHT: 1.0
  RELIABILITY_CONSISTENCY_WEIGHT: 0.25
  RELIABILITY_TARGET_SCALE: 8.0