# GCDR Compress16 — larger geometric FiLM capacity
#
# Variant of gcdr_base.yaml with geo_compress=16 for richer geometric encoding.
# Dual-card paired experiment alongside gcdr_base.

MODEL:
  REFINER_TYPE: "GCDR"

  GCDR:
    GEO_COMPRESS: 16        # double the geo encoding capacity

  GEO_PREPROCESS_MODE: "no_unfold_lite"
