# GCDR Reliability CoupledScaleGuided
#
# Converged main-line variant with stronger residual injection under
# explicit reliability supervision. High-capacity ablation branches were
# removed when GCDR was collapsed to a single paper-path implementation.

MODEL:
  REFINER_TYPE: "GCDR"
  GEO_PREPROCESS_MODE: "no_unfold_lite"

  GCDR:
    GEO_COMPRESS: 16
    RELIABILITY_HIDDEN: 16
    GATE_FLOOR: 0.10
    RESIDUAL_GAIN: 0.75
    RESIDUAL_GATE_FLOOR: 0.05

LOSS:
  RELIABILITY_LOSS_WEIGHT: 1.0
  RELIABILITY_CONSISTENCY_WEIGHT: 0.25
  RELIABILITY_TARGET_SCALE: 6.0